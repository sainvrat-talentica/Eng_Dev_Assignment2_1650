spring:
  application:
    name: analytics-service
  config:
    import: optional:classpath:application-platform-defaults.yml
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

server:
  port: 8080

swifteats:
  jpa:
    enabled: false
  service:
    name: ANALYTICS
  services:
    order:
      base-url: ${ORDER_SERVICE_URL:http://order-service:8082}
    payment:
      base-url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}

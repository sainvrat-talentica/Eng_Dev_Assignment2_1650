services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swifteats
      POSTGRES_USER: swifteats
      POSTGRES_PASSWORD: swifteats
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swifteats -d swifteats"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-migrate:
    image: flyway/flyway:10-alpine
    command: -connectRetries=60 migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/swifteats
      FLYWAY_USER: swifteats
      FLYWAY_PASSWORD: swifteats
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: swifteats
      POSTGRES_USER: swifteats
      POSTGRES_PASSWORD: swifteats
      SWIFTEATS_ALLOW_INSECURE_DEFAULTS: "true"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-local-dev-admin-key-change-me}
      SWIFTEATS_DATASET_PATH: /data/sample-data
      ANALYTICS_IMPORT_ON_STARTUP: "false"
    volumes:
      - ./sample-data:/data/sample-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  analytics-dashboard:
    build:
      context: ./dashboard
    ports:
      - "3002:80"
    depends_on:
      - analytics-service

volumes:
  postgres_data:
